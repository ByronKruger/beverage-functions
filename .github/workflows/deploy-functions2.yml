name: Deploy ASP.NET Azure Functions (Robust + Private Feed)

on:
  push:
    branches: [ master ]
    paths: 
      - 'TestFunctionApp/**'   # Update if your project folder name changed
      - '.github/workflows/**' # Optional: also trigger on workflow changes
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'myFuncApp'
  DOTNET_VERSION: '8.0.x'
  FUNCTIONS_PROJECT: 'TestFunctionApp.csproj'          # Explicit project folder (or .csproj path)
  PUBLISH_DIR: 'publish'                        # Clean, consistent output at workspace root
  AZURE_DEVOPS_ORG: 'krugb'
  AZURE_DEVOPS_PROJ: 'beverages'
  AZURE_DEVOPS_FEED: 'CoffeegCommon'

jobs:
  build-and-deploy:
    runs-on: windows-latest   # Best compatibility for .NET Functions (MSBuild, native deps)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - List directory structure
        shell: pwsh
        run: |
          Write-Host "Current working directory:"
          Get-Location | Format-List
          Write-Host "`nDirectory listing (root):"
          Get-ChildItem -Recurse -Depth 3 | Select-Object FullName, LastWriteTime | Format-Table -AutoSize

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # === More Reliable Auth for Project-Scoped Feed ===
      - name: Add Azure DevOps NuGet Source with Credentials
        shell: pwsh
        run: |

          # Remove any conflicting source first
          dotnet nuget remove source "CoffeegCommon" --ignore-fail-on-missing | Out-Null

          dotnet nuget add source "https://pkgs.dev.azure.com/${{ env.AZURE_DEVOPS_ORG }}/${{ env.AZURE_DEVOPS_PROJ }}/_packaging/${{ env.AZURE_DEVOPS_FEED }}/nuget/v3/index.json" `
            --name "CoffeegCommon" `
            --username "github-ci" `
            --password "${{ secrets.AZURE_DEVOPS_PAT }}" `
            --store-password-in-clear-text

      - name: Restore NuGet packages
        shell: pwsh
        run: dotnet restore ${{ env.FUNCTIONS_PROJECT }} --verbosity minimal

      # === BEST PRACTICE: Clean publish dir + explicit project + consistent output ===
      - name: Clean previous publish output
        shell: pwsh
        run: |
          if (Test-Path ${{ env.PUBLISH_DIR }}) {
            Remove-Item -Recurse -Force ${{ env.PUBLISH_DIR }}
          }

      - name: Build & Publish Functions
        shell: pwsh
        run: |
          dotnet publish ${{ env.FUNCTIONS_PROJECT }} `
            -c Release `
            -o ${{ env.PUBLISH_DIR }} `
            --no-restore `
            -p:PublishReadyToRun=true `
            -p:PublishReadyToRunComposite=true `   # Helps with cross-platform
            -r linux-x64 `                         # Critical: Azure Functions runtime
            --self-contained false `               # Framework-dependent (smaller, correct for Functions)

      # === Deploy (zip deploy via publish profile - convenient & works well) ===
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1   # Current stable major version (v1.5.x as of 2026)
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.PUBLISH_DIR }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}