name: Build and deploy dotnet core app to Azure Function App - myFuncApp

on:
  push:
    branches: [ master ]
    paths: [ 'TestFunctionApp/**' ]
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'myFuncApp'
  PROJECT_PATH: 'TestFunctionApp'
  DOTNET_VERSION: '8.0.x'
  PUBLISH_OUTPUT: './publish'

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # === Private Feed Authentication (Critical Fix) ===
      - name: Authenticate Azure DevOps NuGet Feed
        shell: pwsh
        run: |
          dotnet nuget remove source AzureDevOpsFeed --configfile ${{ env.PROJECT_PATH }}/NuGet.config --ignore-errors
          dotnet nuget add source "https://pkgs.dev.azure.com/YOUR_ORG/YOUR_PROJECT/_packaging/YOUR_FEED/nuget/v3/index.json" `
            --name "AzureDevOpsFeed" `
            --username "ANYTHING" `
            --password ${{ secrets.AZURE_DEVOPS_PAT }} `
            --configfile ${{ env.PROJECT_PATH }}/NuGet.config `
            --store-password-in-clear-text

      # === Restore + Publish (Correct for Functions) ===
      - name: Restore, Build & Publish
        shell: pwsh
        run: |
          cd '${{ env.PROJECT_PATH }}'
          dotnet restore --verbosity detailed
          dotnet publish -c Release -o '${{ github.workspace }}/${{ env.PUBLISH_OUTPUT }}' --verbosity detailed

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8BA2E93A660246E4AD79BD92D8A5327B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8835EF797E6640CFBDE62534DD927E22 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D89E74DF09AD4548841784F5BD997203 }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          slot-name: 'Production'
          package: '${{ env.PUBLISH_OUTPUT }}'